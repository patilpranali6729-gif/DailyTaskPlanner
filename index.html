<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Task Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-4">
    <div class="planner-card">
      <div class="text-center mb-4">
        <h1>Daily Task Planner</h1>
        <p class="text-muted mb-1">Plan your day and manage your tasks easily.</p>
        <div id="currentDate" class="small text-secondary"></div>
      </div>

      <div id="message"></div>

      <form id="taskForm" class="row g-2 mb-4">
        <div class="col-12 col-md-9">
          <input type="text" id="taskInput" class="form-control" placeholder="Enter a task..." autocomplete="off">
        </div>
        <div class="col-12 col-md-3 d-grid">
          <button type="submit" class="btn btn-primary">Add Task</button>
        </div>
      </form>

      <div class="d-flex flex-wrap gap-2 justify-content-center mb-4">
        <button class="btn btn-outline-primary filter-btn active" data-filter="all">All</button>
        <button class="btn btn-outline-warning filter-btn" data-filter="pending">Pending</button>
        <button class="btn btn-outline-success filter-btn" data-filter="completed">Completed</button>
      </div>

      <div class="row g-3 mb-4 text-center">
        <div class="col-4">
          <div class="stat-box">
            <strong id="totalCount">0</strong>
            <span>Total</span>
          </div>
        </div>
        <div class="col-4">
          <div class="stat-box">
            <strong id="pendingCount">0</strong>
            <span>Pending</span>
          </div>
        </div>
        <div class="col-4">
          <div class="stat-box">
            <strong id="completedCount">0</strong>
            <span>Completed</span>
          </div>
        </div>
      </div>

      <div id="taskList"></div>

      <div class="text-center mt-4">
        <button id="clearCompleted" class="btn btn-outline-danger">Clear Completed</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
